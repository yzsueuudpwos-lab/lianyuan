<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蓮緣素食｜店家標籤列印</title>
<style id="pagecss">@page{size:40mm 30mm;margin:0}</style>
<style>
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#f5f5f0;color:#222}
.ui{padding:12px;max-width:560px;margin:auto}h1{font-size:20px;color:#3f7d3a;margin:6px 0}
textarea{width:100%;box-sizing:border-box;height:170px;font-size:15px;padding:8px;border-radius:10px;border:1px solid #bbb}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}button,select{font-size:16px;padding:10px 12px;border-radius:10px;border:0;background:#3f7d3a;color:#fff}
select{background:#fff;color:#222;border:1px solid #bbb}button.g{background:#888}button.o{background:#c8702a}
.note{font-size:13px;color:#666}#err{color:#c00;font-size:14px}
#labels{display:flex;flex-wrap:wrap;gap:8px;padding:12px;justify-content:center}
.lab{width:40mm;height:30mm;box-sizing:border-box;padding:1.5mm 2mm;background:#fff;border:1px dashed #999;overflow:hidden;display:flex;flex-direction:column;font-size:9pt;line-height:1.2}
.w58 .lab{width:58mm;height:40mm;font-size:11pt}
.lab .h{display:flex;justify-content:space-between;font-size:7pt;border-bottom:1px solid #000;padding-bottom:.5mm}
.lab .n{font-size:12pt;font-weight:700;margin-top:.5mm}.w58 .lab .n{font-size:15pt}
.lab .i{font-weight:700;flex:1}.lab .t{font-size:8pt}.lab .x{font-size:7pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media print{.ui{display:none}body{background:#fff}#labels{display:block;padding:0}.lab{border:0;page-break-after:always;break-after:page}}
</style></head><body>
<div class="ui">
<h1>🏷️ 店家標籤列印</h1>
<p class="note">把客人 LINE 傳來的訂單整段貼上，或照格式手打。每 1 個便當印 1 張。</p>
<textarea id="src">【蓮緣素食 訂單】
養生十穀米餐盒 x2 = $300
套餐B x1 = $160
合計：$460
姓名：王小明
電話：0912345678
方式：現場取餐
時間：2026-11-02 12:00
備註：少飯</textarea>
<div class="row">
<select id="size" onchange="setSize()"><option value="40">40×30mm 標籤</option><option value="58">58mm 寬（58×40mm）</option></select>
<label class="note"><input type="checkbox" id="skip"> 單點不印（白飯、龜苓膏等）</label></div>
<div class="row"><button onclick="make()">產生標籤</button><button class="o" onclick="window.print()">🖨️ 列印 / 存 PDF</button>
<button class="g" onclick="saveImg()">🖼️ 存成圖片</button><button class="g" id="bt" onclick="btPrint()">🔵 藍牙直印（測試）</button></div>
<div id="err"></div>
<p class="note">iPhone：多數便宜標籤機要用原廠 App 印 → 按「存成圖片」或「列印→存 PDF」，再到 App 匯入。<br>iPhone Safari 不支援網頁藍牙，「藍牙直印」只在 Android Chrome／電腦 Chrome 有用，且只適用 ESC/POS 指令的機型（TSPL 標籤機不行）。</p>
</div>
<div id="labels"></div>
<script>
const SHOP='蓮緣素食';const SIDE=['白飯','五穀飯','龜苓膏'];
let L=[];
function parse(t){const o={items:[]};t.split(/\n/).forEach(r=>{r=r.trim();let m;
 if(m=r.match(/^(.+?)\s*[xX×＊*]\s*(\d+)/))o.items.push({n:m[1].trim(),q:+m[2]});
 else if(m=r.match(/^姓名[:：]\s*(.*)/))o.name=m[1];else if(m=r.match(/^電話[:：]\s*(.*)/))o.phone=m[1].replace(/\D/g,'');
 else if(m=r.match(/^時間[:：]\s*(.*)/))o.time=m[1];else if(m=r.match(/^備註[:：]\s*(.*)/))o.note=m[1];});return o}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function make(){const o=parse(document.getElementById('src').value);const e=document.getElementById('err');
 let it=o.items;if(document.getElementById('skip').checked)it=it.filter(i=>!SIDE.includes(i.n));
 if(!it.length){e.textContent='看不到品項，格式要像「套餐B x1」';return}e.textContent=o.name?'':'⚠ 沒有姓名';
 L=[];it.forEach(i=>{for(let k=0;k<i.q;k++)L.push({...o,item:i.n})});const N=L.length;L.forEach((l,k)=>l.no=`${k+1}/共${N}`);
 const tm=(o.time||'').replace(/^\d{4}-/,'');
 document.getElementById('labels').innerHTML=L.map(l=>`<div class="lab"><div class="h"><span>${SHOP}</span><span>${l.no}</span></div>
 <div class="n">${esc(l.name||'')}　${l.phone?'#'+l.phone.slice(-3):''}</div><div class="i">${esc(l.item)}</div>
 <div class="t">取餐 ${esc(tm)}</div><div class="x">${l.note?'備註：'+esc(l.note):''}</div></div>`).join('')}
function setSize(){const w=document.getElementById('size').value=='58';document.body.classList.toggle('w58',w);
 document.getElementById('pagecss').textContent=w?'@page{size:58mm 40mm;margin:0}':'@page{size:40mm 30mm;margin:0}'}
// 畫成點陣圖（8 dots/mm = 203dpi）
function draw(l){const w=document.getElementById('size').value=='58';const W=w?464:320,H=w?320:240,f=W/320;
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#000';
 const F=s=>`${s*f}px "PingFang TC","Noto Sans CJK TC",sans-serif`;
 g.font=F(22);g.fillText(SHOP,12*f,30*f);g.textAlign='right';g.fillText(l.no,W-12*f,30*f);g.textAlign='left';g.fillRect(12*f,38*f,W-24*f,2);
 g.font='bold '+F(36);g.fillText(`${l.name||''} ${l.phone?'#'+l.phone.slice(-3):''}`,12*f,82*f);
 g.font='bold '+F(30);g.fillText(l.item,12*f,128*f,W-24*f);
 g.font=F(24);g.fillText('取餐 '+(l.time||'').replace(/^\d{4}-/,''),12*f,175*f);
 if(l.note){g.font=F(22);g.fillText('備註：'+l.note,12*f,215*f,W-24*f)}return c}
async function saveImg(){if(!L.length)make();for(const [k,l] of L.entries()){const a=document.createElement('a');a.download=`標籤_${l.name||''}_${k+1}.png`;a.href=draw(l).toDataURL();a.click();await new Promise(r=>setTimeout(r,300))}}
// ESC/POS 點陣列印 GS v 0
function raster(c){const g=c.getContext('2d'),W=c.width,H=c.height,d=g.getImageData(0,0,W,H).data,bw=W/8;
 const out=[0x1b,0x40,0x1d,0x76,0x30,0,bw&255,bw>>8,H&255,H>>8];
 for(let y=0;y<H;y++)for(let x=0;x<bw;x++){let b=0;for(let i=0;i<8;i++){const p=(y*W+x*8+i)*4;if(d[p]<128)b|=0x80>>i}out.push(b)}
 out.push(0x0a,0x0a,0x0a);return new Uint8Array(out)}
async function btPrint(){if(!navigator.bluetooth){alert('這個瀏覽器不支援網頁藍牙（iPhone Safari 都不支援）。請用「存成圖片」再用印表機 App 印。');return}
 if(!L.length)make();
 try{const SV=[0x18f0,0xffe0,0xff00,'e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455'];
 const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SV});
 const srv=await dev.gatt.connect();let ch=null;
 for(const s of await srv.getPrimaryServices())for(const c of await s.getCharacteristics())if(!ch&&(c.properties.write||c.properties.writeWithoutResponse))ch=c;
 if(!ch)throw '找不到可寫入的通道';
 for(const l of L){const data=raster(draw(l));for(let i=0;i<data.length;i+=180){await ch.writeValueWithoutResponse?ch.writeValueWithoutResponse(data.slice(i,i+180)):ch.writeValue(data.slice(i,i+180));await new Promise(r=>setTimeout(r,20))}}
 alert('已送出 '+L.length+' 張')}catch(e){alert('藍牙列印失敗：'+e)}}
make();
</script></body></html>
