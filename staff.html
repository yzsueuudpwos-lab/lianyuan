<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">

<style id="pagecss">@page{size:40mm 30mm;margin:0}</style>
<style>
body{margin:0;font-family:"Noto Sans TC","PingFang TC",sans-serif;background:#f5f5f0;color:#222;font-size:26px}
header{background:#3f7d3a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:5}
header b{font-size:34px}#stat{font-size:28px}#conn{font-size:20px}
main{padding:14px;max-width:900px;margin:auto}
.remind{background:#fff3c4;border:3px solid #e0a800;border-radius:16px;padding:14px;font-size:28px;margin-bottom:14px;line-height:1.4}
.card{background:#fff;border-radius:20px;box-shadow:0 2px 8px #0002;padding:18px;margin-bottom:18px;border-left:12px solid #e07a1f}
.card .who{font-size:40px;font-weight:700}.card .tm{font-size:32px;color:#c0392b;font-weight:700;margin:6px 0}
.card pre{font-family:inherit;font-size:34px;font-weight:700;margin:10px 0;white-space:pre-wrap}
.card .sm{font-size:24px;color:#555}.card .nt{font-size:28px;background:#fdecea;padding:6px 10px;border-radius:10px;margin:6px 0}
.btns{display:flex;gap:14px;margin-top:12px}.btns button{flex:1;font-size:36px;font-weight:700;padding:28px 8px;border:0;border-radius:18px;color:#fff}
.ok{background:#2e8b3d}.no{background:#c0392b}button:disabled{opacity:.4}
.empty{text-align:center;color:#777;font-size:32px;padding:40px 0}
h2{font-size:28px;color:#555;margin:26px 0 8px}.done{background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:22px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.manual{background:#ff8c1a;color:#fff;font-size:30px;font-weight:700;border-radius:14px;padding:14px;margin:8px 0;line-height:1.35}
.lok{color:#2e8b3d;font-size:20px;white-space:nowrap}.lno{background:#ff8c1a;color:#fff;font-size:22px;font-weight:700;border-radius:8px;padding:2px 8px;white-space:nowrap}
.done .cx{background:#c0392b}#quota{font-size:20px}
.done button{font-size:20px;padding:8px 12px;border-radius:10px;border:0;background:#888;color:#fff}
#pin{position:fixed;inset:0;background:#f5f5f0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9}
#pin input{font-size:48px;width:260px;text-align:center;padding:10px;border-radius:14px;border:2px solid #999}
#pin button,.big{font-size:36px;padding:18px 40px;border:0;border-radius:16px;background:#3f7d3a;color:#fff}
.set{font-size:20px;color:#555;margin-top:30px}.set select,.set button{font-size:20px;padding:6px}
#labels{display:none}
.lab{width:40mm;height:30mm;box-sizing:border-box;padding:1.5mm 2mm;background:#fff;overflow:hidden;display:flex;flex-direction:column;font-size:9pt;line-height:1.2}
.w58 .lab{width:58mm;height:40mm;font-size:11pt}
.lab .h{display:flex;justify-content:space-between;font-size:7pt;border-bottom:1px solid #000;padding-bottom:.5mm}
.lab .n{font-size:12pt;font-weight:700;margin-top:.5mm}.w58 .lab .n{font-size:15pt}
.lab .i{font-weight:700;flex:1}.lab .t{font-size:8pt}.lab .x{font-size:7pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:16px 26px;border-radius:14px;font-size:28px;display:none;z-index:8}
#setv{display:none;padding:14px;max-width:900px;margin:auto}body.setmode main{display:none}body.setmode #setv{display:block}
#setBtn,.back{font-size:28px;font-weight:700;padding:12px 20px;border:0;border-radius:14px;background:#fff;color:#3f7d3a}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.tabs button{font-size:32px;font-weight:700;padding:24px 6px;border:3px solid #3f7d3a;border-radius:18px;background:#fff;color:#3f7d3a}
.tabs button.on{background:#3f7d3a;color:#fff}.tip{font-size:24px;color:#555;margin:6px 0 14px;line-height:1.4}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.cal .wk{text-align:center;font-size:24px;color:#555}
.day{border-radius:14px;padding:8px 2px;text-align:center;font-size:20px;border:0;min-height:130px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.day b{font-size:30px}.day.op{background:#2e8b3d}.day.cl{background:#aaa}.day.na{background:transparent;color:#bbb}.day small{font-size:18px}
.day .cap{margin-top:auto;font-size:18px;background:#fff;color:#333;border-radius:8px;padding:4px 6px;border:0}
.it{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.it .nm{font-size:32px;font-weight:700;flex:1;min-width:200px}.it img{width:120px;height:90px;object-fit:cover;border-radius:10px;background:#eee}
.pb{font-size:34px;font-weight:700;width:110px;padding:18px 0;border:0;border-radius:16px;color:#fff;background:#c0392b}.pb.up{background:#2e8b3d}
.pv{font-size:40px;font-weight:700;min-width:110px;text-align:center}.pv.ch{color:#e07a1f}
.save{position:sticky;bottom:10px;width:100%;font-size:36px;font-weight:700;padding:24px;border:0;border-radius:18px;background:#e07a1f;color:#fff;margin-top:10px}
.so{font-size:32px;font-weight:700;padding:22px 18px;border:0;border-radius:16px;color:#fff;min-width:260px;background:#2e8b3d}.so.x{background:#c0392b}
.ph{font-size:30px;font-weight:700;padding:20px 18px;border:0;border-radius:16px;color:#fff;background:#3f7d3a}
@media print{#setv,header,main,#pin,#toast{display:none!important}body{background:#fff}#labels{display:block}.lab{page-break-after:always;break-after:page}}
</style></head><body>
<div id="pin"><div style="font-size:40px;font-weight:700">蓮緣素食 接單</div><div>請輸入店員密碼</div>
<input id="pinIn" type="password" inputmode="numeric" autocomplete="off"><button onclick="savePin()">開始接單</button><div id="pinErr" style="color:#c00"></div></div>
<header><b>🪷 蓮緣接單</b><span id="stat">今天：0 份｜$0</span><span id="quota"></span><span id="conn">連線中…</span><button id="setBtn" onclick="showSet(!document.body.classList.contains('setmode'))">⚙ 店家設定</button></header>
<main>
<div id="manual"></div>
<div id="list"><div class="empty">等待新訂單…</div></div>
<h2>今天處理過的</h2><div id="done"></div>
<div class="set">標籤尺寸 <select id="size" onchange="setSize()"><option value="40">40×30mm</option><option value="58">58×40mm</option></select>
　列印方式 <select id="mode" onchange="localStorage.ly_mode=this.value"><option value="rawbt">RawBT 直接印</option><option value="print">系統列印</option><option value="none">不印</option></select>
　<label><input type="checkbox" id="skip" onchange="localStorage.ly_skip=this.checked?1:''"> 白飯/五穀飯/龜苓膏不印</label>
　<button onclick="testPrint()">印測試張</button> <button onclick="localStorage.removeItem('ly_pin');location.reload()">換密碼</button></div>
</main>
<div id="setv">
<div class="tabs"><button data-t="cal" onclick="tab('cal')">📅 預訂日期</button><button data-t="price" onclick="tab('price')">💲 改價錢</button>
<button data-t="photo" onclick="tab('photo')">📷 換照片</button><button data-t="sold" onclick="tab('sold')">⛔ 今天賣完</button></div>
<div id="setBody"></div>
<button class="save" style="background:#3f7d3a" onclick="showSet(false)">⬅ 回到接單</button>
<input type="file" id="pic" accept="image/*" style="display:none" onchange="gotPic(this)">
</div>
<div id="labels"></div><div id="toast"></div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbydH3BwwshrRx2gKBIai570utuJRZCNYLdm-BNwcu_K44d8_NPxybF7l7yFXt6Ge9vwdw/exec'; // 接單後端網址（Apps Script 部署後貼上，和 index.html 相同）
const SHOP='蓮緣素食',SIDE=['白飯','五穀飯','龜苓膏'],POLL=10000;
let manualMsg={};let PIN=localStorage.ly_pin||'',seen=null,busy={},AC=null,data={pending:[],done:[]};
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
// JSONP
function api(p){return new Promise((res,rej)=>{if(!GAS_URL)return rej('尚未設定後端網址');const cb='cb'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
 const t=setTimeout(()=>{clean();rej('逾時')},15000);function clean(){clearTimeout(t);delete window[cb];s.remove()}
 window[cb]=d=>{clean();d&&d.ok?res(d):rej(d&&d.error||'錯誤')};s.onerror=()=>{clean();rej('連線失敗')};
 s.src=GAS_URL+'?'+new URLSearchParams({...p,pin:PIN,callback:cb,_:Date.now()});document.body.appendChild(s)})}
function savePin(){PIN=$('pinIn').value.trim();if(!PIN)return;unlockAudio();api({action:'list'}).then(d=>{localStorage.ly_pin=PIN;$('pin').style.display='none';render(d);start()}).catch(e=>{$('pinErr').textContent=e=='pin'?'密碼不對':'錯誤：'+e})}
// 叮聲（第一次點畫面後才能出聲）
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function ding(){try{unlockAudio();[0,0.35,0.7].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=1320;o.connect(g);g.connect(AC.destination);
 const t=AC.currentTime+d;g.gain.setValueAtTime(0.6,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);o.start(t);o.stop(t+0.3)})}catch(e){}
 if(navigator.vibrate)navigator.vibrate([400,200,400,200,400])}
document.addEventListener('click',unlockAudio);
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){wake();poll()}});
function parseItems(s){return String(s).split('\n').map(l=>{const m=l.match(/^(.+?)\s*x(\d+)\s*$/);return m?{n:m[1].trim(),q:+m[2]}:null}).filter(Boolean)}
function render(d){data=d;$('stat').textContent=`今天：${d.count} 份｜$${d.total}`;$('conn').textContent='✅ '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 const ids=d.pending.map(o=>o.id);if(seen&&ids.some(i=>!seen.has(i)))ding();seen=new Set(ids);
 document.title=(ids.length?`(${ids.length}) `:'')+'蓮緣接單';
 $('list').innerHTML=d.pending.length?d.pending.map(o=>`<div class="card"><div class="who">${esc(o.name)}　<span class="sm">${esc(o.phone)}</span></div>
 <div class="tm">${o.pre?'📅【預訂單】':''}取餐 ${esc(o.pickup)}</div><pre>${esc(o.items)}</pre>${o.note?`<div class="nt">備註：${esc(o.note)}</div>`:''}
 <div class="sm">合計 $${o.total}｜編號 ${esc(o.id)}｜${esc(String(o.time).slice(11,16))} 下單｜${o.line?'LINE 已連上 ✅':'LINE 還沒收到客人訊息'}</div>
 <div class="btns"><button class="ok" ${busy[o.id]?'disabled':''} onclick="act('${esc(o.id)}','已接單')">✅ 接單並列印</button>
 <button class="no" ${busy[o.id]?'disabled':''} onclick="act('${esc(o.id)}','售完')">❌ 售完</button></div></div>`).join(''):'<div class="empty">等待新訂單…</div>';
 $('done').innerHTML=d.done.map(o=>`<div class="done"><span>${{'已接單':'✅','售完':'❌','取消':'🚫'}[o.status]||''} ${esc(o.status)}｜${esc(o.name)}｜${esc(String(o.items).replace(/\n/g,'、'))}｜$${o.total}
 ${String(o.reply).startsWith('✅')?'<span class="lok">已自動回覆 LINE ✅</span>':'<span class="lno">請手動回覆</span>'}</span>
 <span>${o.status=='已接單'?`<button onclick="reprint('${esc(o.id)}')">補印</button> <button class="cx" onclick="act('${esc(o.id)}','取消')">🚫 取消</button>`:''}</span></div>`).join('')||'<div class="sm">還沒有</div>';
 $('manual').innerHTML=Object.keys(manualMsg).map(id=>`<div class="manual">⚠ 請手動在 LINE 回覆客人：${esc(manualMsg[id])}<br><button class="big" style="font-size:24px;padding:8px 20px;background:#fff;color:#c05800" onclick="delete manualMsg['${esc(id)}'];render(data)">我回好了</button></div>`).join('')}
function quota(){api({action:'quota'}).then(q=>{$('quota').textContent=q.enabled===false?'':q.limit?`LINE 本月 ${q.used}/${q.limit} 則`:(q.used!=null?`LINE 本月 ${q.used} 則`:'')}).catch(()=>{})}
function poll(){if(!PIN||!GAS_URL)return;api({action:'list'}).then(render).catch(e=>{if(e=='pin'){localStorage.removeItem('ly_pin');location.reload()}$('conn').textContent='⚠ '+e})}
function start(){wake();poll();setInterval(poll,POLL);quota();setInterval(quota,600000)}
function find(id){return data.pending.concat(data.done).find(o=>o.id==id)}
function act(id,st){const o=find(id);if(!o)return;
 if(st=='售完'&&!confirm('確定這張單「售完」？\n會自動用 LINE 通知客人'))return;
 if(st=='取消'&&!confirm(`確定要取消 ${o.name} 的訂單（編號 ${o.id}）？\n會自動用 LINE 通知客人`))return;
 if(st=='已接單')printOrder(o); // 先印（要在按下按鈕的當下開 RawBT）
 busy[id]=1;render(data);
 api({action:'set',id,status:st}).then(r=>{const say={'已接單':'收到，請於 '+o.pickup+' 取餐。下次訂餐直接點👉 https://yzsueuudpwos-lab.github.io/lianyuan/','售完':'今天已售完，抱歉','取消':'訂單已取消'}[st];
 if(r.manual){manualMsg[id]=`${o.name}（編號 ${id}）→ 回「${say}」`;ding()}else delete manualMsg[id];
 toast(r.manual?'請手動在 LINE 回覆客人':st+'，已自動回覆 LINE ✅');delete busy[id];poll();quota.t=0})
 .catch(e=>{delete busy[id];render(data);alert('沒有存到，請再按一次：'+e)})}
function reprint(id){const o=find(id);if(o)printOrder(o)}
// ---- 標籤（與 print.html 相同版面）----
function labelsOf(o){let it=parseItems(o.items);if($('skip').checked)it=it.filter(i=>!SIDE.includes(i.n));const L=[];
 it.forEach(i=>{for(let k=0;k<i.q;k++)L.push({name:o.name,phone:String(o.phone||'').replace(/\D/g,''),time:o.pickup,note:o.note,item:i.n})});
 L.forEach((l,k)=>l.no=`${k+1}/共${L.length}`);return L}
function setSize(){const w=$('size').value=='58';localStorage.ly_size=$('size').value;document.body.classList.toggle('w58',w);$('pagecss').textContent=w?'@page{size:58mm 40mm;margin:0}':'@page{size:40mm 30mm;margin:0}'}
function draw(l){const w=$('size').value=='58';const W=w?464:320,H=w?320:240,f=W/320;
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#000';
 const F=s=>`${s*f}px "Noto Sans CJK TC","Noto Sans TC","PingFang TC",sans-serif`;
 g.font=F(22);g.fillText(SHOP,12*f,30*f);g.textAlign='right';g.fillText(l.no,W-12*f,30*f);g.textAlign='left';g.fillRect(12*f,38*f,W-24*f,2);
 g.font='bold '+F(36);g.fillText(`${l.name||''} ${l.phone?'#'+l.phone.slice(-3):''}`,12*f,82*f,W-24*f);
 g.font='bold '+F(30);g.fillText(l.item,12*f,128*f,W-24*f);
 g.font=F(24);g.fillText('取餐 '+(l.time||''),12*f,175*f,W-24*f);
 if(l.note){g.font=F(22);g.fillText('備註：'+l.note,12*f,215*f,W-24*f)}return c}
// ESC/POS：ESC @ + GS v 0 點陣圖，每張後走紙
function raster(c){const g=c.getContext('2d'),W=c.width,H=c.height,d=g.getImageData(0,0,W,H).data,bw=W/8;
 const out=[0x1d,0x76,0x30,0,bw&255,bw>>8,H&255,H>>8];
 for(let y=0;y<H;y++)for(let x=0;x<bw;x++){let b=0;for(let i=0;i<8;i++){const p=(y*W+x*8+i)*4;if(d[p]<128)b|=0x80>>i}out.push(b)}
 out.push(0x0a,0x0a,0x0a);return out}
function b64(arr){let s='';for(let i=0;i<arr.length;i+=8192)s+=String.fromCharCode.apply(null,arr.slice(i,i+8192));return btoa(s)}
function rawbtUrl(bytes){return 'intent:base64,'+b64(bytes)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'}
function printOrder(o){const L=labelsOf(o);if(!L.length){toast('沒有要印的品項');return}const m=$('mode').value;if(m=='none')return;
 if(m=='rawbt'&&/Android/i.test(navigator.userAgent)){let bytes=[0x1b,0x40];L.forEach(l=>bytes=bytes.concat(raster(draw(l))));location.href=rawbtUrl(bytes);return}
 $('labels').innerHTML=L.map(l=>`<div class="lab"><div class="h"><span>${SHOP}</span><span>${l.no}</span></div>
 <div class="n">${esc(l.name)}　${l.phone?'#'+l.phone.slice(-3):''}</div><div class="i">${esc(l.item)}</div>
 <div class="t">取餐 ${esc(l.time)}</div><div class="x">${l.note?'備註：'+esc(l.note):''}</div></div>`).join('');setTimeout(()=>window.print(),50)}
function testPrint(){printOrder({name:'測試',phone:'0912345678',pickup:'今天 下午 4:30',items:'測試便當 x1',note:''})}
// ===== ⚙ 店家設定（存到 Google 表格「設定」，客人網頁會即時讀取）=====
let ST=null,curTab='cal',newPrice={},picFor='';
const WK='日一二三四五六',PRE_DAYS=30;
const LF=(()=>{try{return new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{day:'numeric'})}catch(e){return null}})();
function lunarDay(d){try{const p=LF&&LF.formatToParts(d).find(x=>x.type=='day');return p?parseInt(p.value,10):0}catch(e){return 0}}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function baseOpen(d){return d.getDay()!=0||[1,15].includes(lunarDay(d))}
function priceOf(m){return +(ST.price||{})[m[1]]||m[2]}
function showSet(on){document.body.classList.toggle('setmode',on);window.scrollTo(0,0);if(on){$('setBody').innerHTML='<div class="empty">讀取中…</div>';api({action:'settings'}).then(d=>{ST=d;newPrice={};tab(curTab)}).catch(e=>$('setBody').innerHTML='<div class="empty">⚠ 讀不到設定：'+esc(e)+'</div>')}}
function save(d,msg){toast('儲存中…');return api({action:'save',data:JSON.stringify(d)}).then(r=>{ST=r;toast(msg||'已儲存 ✅');tab(curTab)}).catch(e=>alert('沒有存到，請再按一次：'+e))}
function tab(t){curTab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));if(!ST)return;const B=$('setBody');
 if(t=='cal'){const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);let h='<div class="tip">綠色＝接預訂，灰色＝不接。<b>按日期</b>就切換。<br>按「上限」可設這天最多接幾個預訂便當。（10 個以上才算預訂）</div><div class="cal">'+[...WK].map(w=>`<div class="wk">${w}</div>`).join('');
  for(let i=0;i<start.getDay();i++)h+='<div class="day na"></div>';
  for(let i=0;i<PRE_DAYS;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=ymd(d),o=ST.days[k]||{},op=o.off?false:o.on?true:baseOpen(d),lu=lunarDay(d),bk=+ST.booked[k]||0;
   h+=`<button class="day ${op?'op':'cl'}" onclick="flip('${k}')"><small>${d.getMonth()+1}月</small><b>${d.getDate()}</b><small>${op?'接預訂':'不接'}${lu==1?'・初一':lu==15?'・十五':''}</small>${bk?`<small>已訂 ${bk} 個</small>`:''}<span class="cap" onclick="event.stopPropagation();setCap('${k}')">${o.cap?'上限 '+o.cap:'上限：不限'}</span></button>`}
  B.innerHTML=h+'</div>'}
 if(t=='price'){B.innerHTML='<div class="tip">按 −10 / +10 改價錢，改好按最下面<b>「儲存價錢」</b>。橘色＝還沒存。</div>'+MENU.map((m,i)=>{const v=newPrice[m[1]]??priceOf(m);return `<div class="it"><div class="nm">${esc(m[1])}</div><button class="pb" onclick="bump(${i},-10)">−10</button><div class="pv ${newPrice[m[1]]!=null?'ch':''}">$${v}</div><button class="pb up" onclick="bump(${i},10)">+10</button></div>`}).join('')+`<button class="save" onclick="savePrice()" ${Object.keys(newPrice).length?'':'disabled'}>💾 儲存價錢${Object.keys(newPrice).length?'（改了 '+Object.keys(newPrice).length+' 項）':''}</button>`}
 if(t=='photo'){B.innerHTML='<div class="tip">按「換照片」→ 拍照或選相簿 → 確定。照片會自動縮小再上傳。</div>'+MENU.map((m,i)=>{const u=(ST.photo||{})[m[1]]||(m[4]?m[4]+'.jpg':'');return `<div class="it">${u?`<img src="${esc(u)}">`:'<img alt="">'}<div class="nm">${esc(m[1])}</div><button class="ph" onclick="pickPic(${i})">📷 換照片</button>${(ST.photo||{})[m[1]]?`<button class="pb" style="width:auto;padding:18px;font-size:24px;background:#888" onclick="resetPic(${i})">用回原本</button>`:''}</div>`}).join('')}
 if(t=='sold'){B.innerHTML='<div class="tip">按一下切換。紅色＝<b>今天賣完</b>：客人不能選今天取餐，明天以後和預訂照常可訂；<b>明天會自動恢復</b>。</div>'+MENU.map((m,i)=>{const x=!!ST.soldOut[m[1]];return `<div class="it"><div class="nm">${esc(m[1])}</div><button class="so ${x?'x':''}" onclick="sold(${i},${!x})">${x?'⛔ 今天賣完':'✅ 有賣'}</button></div>`}).join('')}}
function flip(k){const [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d),o=ST.days[k]||{},op=o.off?false:o.on?true:baseOpen(dt),cap=+o.cap||0;
 let v=op?{off:true,cap}:(baseOpen(dt)?{cap}:{on:true,cap});if(!v.off&&!v.on&&!cap)v=null;save({days:{[k]:v}},op?`${m}/${d} 改成不接預訂`:`${m}/${d} 改成接預訂`)}
function setCap(k){const o=ST.days[k]||{},a=prompt(`${k.slice(5).replace('-','/')} 最多接幾個預訂便當？\n（不限就填 0）`,o.cap||'');if(a===null)return;const n=Math.max(0,parseInt(a,10)||0);
 const v={off:!!o.off,on:!!o.on,cap:n};save({days:{[k]:(!v.off&&!v.on&&!n)?null:v}},n?'上限 '+n+' 個 ✅':'不限 ✅')}
function bump(i,d){const m=MENU[i],v=Math.max(10,(newPrice[m[1]]??priceOf(m))+d);if(v==priceOf(m))delete newPrice[m[1]];else newPrice[m[1]]=v;tab('price')}
function savePrice(){const n=Object.keys(newPrice);if(!n.length)return;if(!confirm('確定改價錢？\n'+n.map(k=>`${k}：$${newPrice[k]}`).join('\n')))return;save({price:newPrice},'價錢已儲存 ✅ 客人網頁已更新').then(()=>{newPrice={};tab('price')})}
function sold(i,x){save({soldOut:{[MENU[i][1]]:x}},x?MENU[i][1]+' 今天賣完':MENU[i][1]+' 恢復有賣')}
function resetPic(i){if(confirm('用回原本的照片？'))save({photoReset:MENU[i][1]})}
function pickPic(i){picFor=MENU[i][1];$('pic').value='';$('pic').click()}
function shrink(file,max=800,qual=0.72){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',qual))};im.onerror=()=>rej('讀不到照片');im.src=u})}
async function gotPic(inp){const f=inp.files&&inp.files[0];if(!f||!picFor)return;try{toast('照片縮小中…');const data=await shrink(f);
 if(!confirm(`把「${picFor}」換成這張照片？（約 ${Math.round(data.length*0.75/1024)} KB）`))return;toast('上傳中，請稍等…');
 const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'photo',pin:PIN,name:picFor,data})}).then(r=>r.json());
 if(!r.ok)throw r.error;toast('照片已換好 ✅');showSet(true);curTab='photo'}catch(e){alert('照片沒有換成功，請再試一次：'+e)}}
$('size').value=localStorage.ly_size||'40';setSize();$('mode').value=localStorage.ly_mode||'rawbt';$('skip').checked=!!localStorage.ly_skip;
if(!GAS_URL){$('conn').textContent='⚠ 尚未設定後端網址'}
if(PIN){$('pin').style.display='none';start()}else $('pin').style.display='flex';
</script></body></html>
