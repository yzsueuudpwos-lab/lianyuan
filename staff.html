#ed .pic{display:flex;gap:14px;align-items:center}#ed .pic img{width:180px;height:135px;object-fit:cover;border-radius:14px;background:#eee}
#ed .ck{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:700;margin-top:18px;color:#c0392b}#ed .ck input{width:40px;height:40px}
.mi{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;display:flex;gap:14px;align-items:center;border-left:12px solid #2e8b3d}
.mi.off{border-left-color:#aaa;opacity:.65}.mi img,.mi .noimg{width:130px;height:98px;object-fit:cover;border-radius:12px;background:#eee;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:#888}
.mi .tx{flex:1;min-width:0}.mi .nm{font-size:32px;font-weight:700}.mi .sub{font-size:22px;color:#555;margin-top:4px}
.mi .tag{display:inline-block;font-size:20px;font-weight:700;border-radius:8px;padding:2px 10px;margin-right:6px;color:#fff;background:#2e8b3d}.mi .tag.x{background:#888}.mi .tag.l{background:#c0392b}
.mi .ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}.mi .ac button{font-size:24px;font-weight:700;padding:14px 12px;border:0;border-radius:12px;color:#fff;background:#3f7d3a;min-width:100px}
.mi .ac .mv{background:#e9e9e2;color:#333}.mi .ac .dn{background:#888}.mi .ac .upn{background:#2e8b3d}
.mbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.mbar button{flex:1;min-width:200px;font-size:28px;font-weight:700;padding:20px 10px;border:0;border-radius:16px;color:#fff;background:#3f7d3a}
.mbar .gy{background:#888}.mbar .gn{background:#2e8b3d}
@media print{#setv,header,main,#pin,#toast{display:none!important}body{background:#fff}#labels{display:block}.lab{page-break-after:always;break-after:page}}
</style></head><body>
<div id="pin"><div style="font-size:40px;font-weight:700">蓮緣素食 接單</div><div>請輸入店員密碼</div>
<input id="pinIn" type="password" inputmode="numeric" autocomplete="off"><button onclick="savePin()">開始接單</button><div id="pinErr" style="color:#c00"></div></div>
<header><b>🪷 蓮緣接單</b><span id="stat">今天：0 份｜$0</span><span id="quota"></span><span id="conn">連線中…</span><button id="setBtn" onclick="showSet(!document.body.classList.contains('setmode'))">⚙ 店家設定</button></header>
<main>
<button id="onBtn" class="off" onclick="toggleOnline()">🔴 暫停接單（按這裡上線）</button><div id="onTip">今天還沒上線，客人只能預訂明天以後</div>
<div id="manual"></div>
<div id="list"><div class="empty">等待新訂單…</div></div>
<h2>今天處理過的</h2><div id="done"></div>
<div class="set">標籤尺寸 <select id="size" onchange="setSize()"><option value="40">40×30mm</option><option value="58">58×40mm</option></select>
　列印方式 <select id="mode" onchange="localStorage.ly_mode=this.value"><option value="rawbt">RawBT 直接印</option><option value="print">系統列印</option><option value="none">不印</option></select>
　<label><input type="checkbox" id="skip" onchange="localStorage.ly_skip=this.checked?1:''"> 白飯/五穀飯/龜苓膏不印</label>
　<button onclick="testPrint()">印測試張</button> <button onclick="localStorage.removeItem('ly_pin');location.reload()">換密碼</button></div>
</main>
<div id="setv">
<div class="tabs"><button data-t="menu" onclick="tab('menu')">🍱 菜單管理</button><button data-t="cal" onclick="tab('cal')">📅 預訂日期</button><button data-t="sold" onclick="tab('sold')">⛔ 今天賣完</button></div>
<div id="setBody"></div>
<button class="save" style="background:#3f7d3a" onclick="showSet(false)">⬅ 回到接單</button>
<input type="file" id="pic" accept="image/*" style="display:none" onchange="gotPic(this)">
</div>
<div id="labels"></div><div id="toast"></div>
<div class="mdl" id="ask"><div class="bx"><div class="ic" id="askIc"></div><h3 id="askT"></h3><div class="ms" id="askM"></div><div id="askIn"></div><div class="bb" id="askB"></div></div></div>
<div class="mdl" id="ed"><div class="bx"><h3 class="g" id="edT" style="text-align:center">編輯餐點</h3>
<label>品名</label><input type="text" id="eName" maxlength="30">
<label>價錢</label><div class="prow"><button onclick="ePrice(-10)">−10</button><input type="text" id="ePrice" inputmode="numeric" pattern="[0-9]*" maxlength="4" onfocus="this.select()"><button class="up" onclick="ePrice(10)">+10</button></div>
<label>分類</label><select id="eCat" onchange="$('eCatNew').style.display=this.value=='+'?'block':'none'"></select><input type="text" id="eCatNew" maxlength="12" placeholder="輸入新分類，例如：過年預購" style="display:none;margin-top:8px">
<label>說明</label><textarea id="eDesc" rows="3" maxlength="200"></textarea>
<label>照片</label><div class="pic"><img id="ePic" alt=""><div><button class="ph" onclick="pickPic()">📷 拍照／選照片</button><div id="ePicSt" style="font-size:22px;color:#555;margin-top:6px"></div></div></div>
<div class="ck"><input type="checkbox" id="eLim" onchange="$('eLimBox').style.display=this.checked?'block':'none'"><label for="eLim" style="margin:0;color:#c0392b">🧧 限定期間／預購專用</label></div>
<div id="eLimBox" style="display:none"><div class="tip" style="margin:6px 0">客人只能選這段日子取餐（例如過年預購）；過了結束日自動下架</div>
<label>開始取餐日</label><input type="date" id="eFrom"><label>最後取餐日</label><input type="date" id="eTo"></div>
<div class="ck" style="color:#2e8b3d"><input type="checkbox" id="eOn"><label for="eOn" style="margin:0">✅ 上架（客人看得到）</label></div>
<div class="bb"><button class="cn" onclick="edClose()">取消</button><button class="gr" onclick="edOk()">完成</button></div>
<div class="bb" id="eDelBox"><button class="rd" style="font-size:26px;padding:16px" onclick="edDel()">🗑 刪除這個餐點</button></div></div></div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbydH3BwwshrRx2gKBIai570utuJRZCNYLdm-BNwcu_K44d8_NPxybF7l7yFXt6Ge9vwdw/exec'; // 接單後端網址（Apps Script 部署後貼上，和 index.html 相同）
const SHOP='蓮緣素食',SIDE=['白飯','五穀飯','龜苓膏'],POLL=10000;
let manualMsg={};let PIN=localStorage.ly_pin||'',seen=null,busy={},AC=null,data={pending:[],done:[]};
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
// ===== 大字提示框（取代瀏覽器的 alert/confirm/prompt）=====
// ask({ic,t,m,ok,okc,no,num}) → Promise：按確定 = true（有 num 就回傳數字），取消 = false/null
function ask(o){return new Promise(res=>{const A=$('ask');$('askIc').textContent=o.ic||'';$('askT').textContent=o.t||'';$('askT').className=o.okc=='gr'?'g':'';$('askM').textContent=o.m||'';
 $('askIn').innerHTML=o.num!=null?`<input class="num" id="askNum" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="${esc(o.num)}" onfocus="this.select()">`:'';
 const B=$('askB');B.innerHTML='';const done=v=>{A.style.display='none';res(v)};
 if(o.no!==false){const c=document.createElement('button');c.className='cn';c.textContent=o.no||'取消';c.onclick=()=>done(o.num!=null?null:false);B.appendChild(c)}
 const k=document.createElement('button');k.className=o.okc||'gr';k.textContent=o.ok||'確定';k.onclick=()=>done(o.num!=null?Math.max(0,parseInt(String($('askNum').value).replace(/\D/g,''),10)||0):true);B.appendChild(k);
 A.style.display='flex';if(o.num!=null)setTimeout(()=>$('askNum').focus(),50)})}
function say(m,t){return ask({ic:'⚠️',t:t||'沒有存到',m,ok:'好',okc:'or',no:false})}
// JSONP
function api(p){return new Promise((res,rej)=>{if(!GAS_URL)return rej('尚未設定後端網址');const cb='cb'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
 const t=setTimeout(()=>{clean();rej('逾時')},15000);function clean(){clearTimeout(t);delete window[cb];s.remove()}
 window[cb]=d=>{clean();d&&d.ok?res(d):rej(d&&d.error||'錯誤')};s.onerror=()=>{clean();rej('連線失敗')};
 s.src=GAS_URL+'?'+new URLSearchParams({...p,pin:PIN,callback:cb,_:Date.now()});document.body.appendChild(s)})}
function savePin(){PIN=$('pinIn').value.trim();if(!PIN)return;unlockAudio();api({action:'list'}).then(d=>{localStorage.ly_pin=PIN;$('pin').style.display='none';render(d);start()}).catch(e=>{$('pinErr').textContent=e=='pin'?'密碼不對':'錯誤：'+e})}
// 叮聲（第一次點畫面後才能出聲）
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function ding(){try{unlockAudio();[0,0.35,0.7].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=1320;o.connect(g);g.connect(AC.destination);
 const t=AC.currentTime+d;g.gain.setValueAtTime(0.6,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);o.start(t);o.stop(t+0.3)})}catch(e){}
 if(navigator.vibrate)navigator.vibrate([400,200,400,200,400])}
document.addEventListener('click',unlockAudio);
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){wake();poll()}});
function parseItems(s){return String(s).split('\n').map(l=>{const m=l.match(/^(.+?)\s*x(\d+)\s*$/);return m?{n:m[1].trim(),q:+m[2]}:null}).filter(Boolean)}
function render(d){data=d;if(d.online)showOnline(d.online);$('stat').textContent=`今天：${d.count} 份｜$${d.total}`;$('conn').textContent='✅ '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 const ids=d.pending.map(o=>o.id);if(seen&&ids.some(i=>!seen.has(i)))ding();seen=new Set(ids);
 document.title=(ids.length?`(${ids.length}) `:'')+'蓮緣接單';
 $('list').innerHTML=d.pending.length?d.pending.map(o=>`<div class="card"><div class="who">${esc(o.name)}　<span class="sm">${esc(o.phone)}</span></div>
 <div class="tm">${o.pre?'📅【預訂單】':''}取餐 ${esc(o.pickup)}</div><pre>${esc(o.items)}</pre>${o.note?`<div class="nt">備註：${esc(o.note)}</div>`:''}
 <div class="sm">合計 $${o.total}｜編號 ${esc(o.id)}｜${esc(String(o.time).slice(11,16))} 下單｜${o.line?'LINE 已連上 ✅':'LINE 還沒收到客人訊息'}</div>
 <div class="btns"><button class="ok" ${busy[o.id]?'disabled':''} onclick="act('${esc(o.id)}','已接單')">✅ 接單並列印</button>
 <button class="no" ${busy[o.id]?'disabled':''} onclick="act('${esc(o.id)}','售完')">❌ 售完</button></div></div>`).join(''):'<div class="empty">等待新訂單…</div>';
 $('done').innerHTML=d.done.map(o=>`<div class="done"><span>${{'已接單':'✅','售完':'❌','取消':'🚫'}[o.status]||''} ${esc(o.status)}｜${esc(o.name)}｜${esc(String(o.items).replace(/\n/g,'、'))}｜$${o.total}
 ${String(o.reply).startsWith('✅')?'<span class="lok">已自動回覆 LINE ✅</span>':'<span class="lno">請手動回覆</span>'}</span>
 <span>${o.status=='已接單'?`<button onclick="reprint('${esc(o.id)}')">補印</button> <button class="cx" onclick="act('${esc(o.id)}','取消')">🚫 取消</button>`:''}</span></div>`).join('')||'<div class="sm">還沒有</div>';
 $('manual').innerHTML=Object.keys(manualMsg).map(id=>`<div class="manual">⚠ 請手動在 LINE 回覆客人：${esc(manualMsg[id])}<br><button class="big" style="font-size:24px;padding:8px 20px;background:#fff;color:#c05800" onclick="delete manualMsg['${esc(id)}'];render(data)">我回好了</button></div>`).join('')}
// ===== 上線／暫停接單 =====
let ONLINE={open:false,why:'paused'};
function showOnline(o){if(o)ONLINE=o;const b=$('onBtn');b.className=ONLINE.open?'on':'off';
 b.textContent=ONLINE.open?'🟢 接單中（按這裡暫停）':'🔴 暫停接單（按這裡上線）';
 $('onTip').textContent=ONLINE.open?'客人可以訂今天的便當。太忙就按上面暫停。':ONLINE.why=='late'?'已過 19:30，今天自動停止接單；預訂明天以後照常':'客人現在不能訂今天的；預訂明天以後照常'}
async function toggleOnline(){const want=!ONLINE.open;
 if(!(await ask(want?{ic:'🟢',t:'確定上線，開始接今天的單？',m:'客人就可以訂今天取餐的便當',ok:'確定上線',okc:'gr'}:{ic:'⏸️',t:'確定暫停接今天的單？',m:'客人不能再訂今天取餐的便當\n（預訂明天以後照常）',ok:'確定暫停',okc:'rd'})))return;
 $('onBtn').disabled=true;api({action:'online',on:want?1:0}).then(r=>{showOnline(r.online);toast(r.online.open?'已上線，開始接今天的單 ✅':want?'已過 19:30，今天不能再上線':'已暫停接今天的單')})
 .catch(e=>say('請再按一次：'+e)).finally(()=>$('onBtn').disabled=false)}
function quota(){api({action:'quota'}).then(q=>{$('quota').textContent=q.enabled===false?'':q.limit?`LINE 本月 ${q.used}/${q.limit} 則`:(q.used!=null?`LINE 本月 ${q.used} 則`:'')}).catch(()=>{})}
function poll(){if(!PIN||!GAS_URL)return;api({action:'list'}).then(render).catch(e=>{if(e=='pin'){localStorage.removeItem('ly_pin');location.reload()}$('conn').textContent='⚠ '+e})}
function start(){wake();poll();setInterval(poll,POLL);quota();setInterval(quota,600000)}
function find(id){return data.pending.concat(data.done).find(o=>o.id==id)}
async function act(id,st){const o=find(id);if(!o)return;
 if(st=='售完'&&!(await ask({ic:'❌',t:'確定這張單「售完」？',m:'會自動用 LINE 通知客人',ok:'確定售完',okc:'rd'})))return;
 if(st=='取消'&&!(await ask({ic:'🚫',t:`確定取消 ${o.name} 的訂單？`,m:`編號 ${o.id}\n會自動用 LINE 通知客人`,ok:'確定取消',okc:'rd',no:'不要'})))return;
 if(st=='已接單')printOrder(o); // 先印（要在按下按鈕的當下開 RawBT）
 busy[id]=1;render(data);
 api({action:'set',id,status:st}).then(r=>{const say={'已接單':'收到，請於 '+o.pickup+' 取餐。下次訂餐直接點👉 https://yzsueuudpwos-lab.github.io/lianyuan/','售完':'今天已售完，抱歉','取消':'訂單已取消'}[st];
 if(r.manual){manualMsg[id]=`${o.name}（編號 ${id}）→ 回「${say}」`;ding()}else delete manualMsg[id];
 toast(r.manual?'請手動在 LINE 回覆客人':st+'，已自動回覆 LINE ✅');delete busy[id];poll();quota.t=0})
 .catch(e=>{delete busy[id];render(data);say('請再按一次：'+e)})}
function reprint(id){const o=find(id);if(o)printOrder(o)}
// ---- 標籤（與 print.html 相同版面）----
function labelsOf(o){let it=parseItems(o.items);if($('skip').checked)it=it.filter(i=>!SIDE.includes(i.n));const L=[];
 it.forEach(i=>{for(let k=0;k<i.q;k++)L.push({name:o.name,phone:String(o.phone||'').replace(/\D/g,''),time:o.pickup,note:o.note,item:i.n})});
 L.forEach((l,k)=>l.no=`${k+1}/共${L.length}`);return L}
function setSize(){const w=$('size').value=='58';localStorage.ly_size=$('size').value;document.body.classList.toggle('w58',w);$('pagecss').textContent=w?'@page{size:58mm 40mm;margin:0}':'@page{size:40mm 30mm;margin:0}'}
function draw(l){const w=$('size').value=='58';const W=w?464:320,H=w?320:240,f=W/320;
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#000';
 const F=s=>`${s*f}px "Noto Sans CJK TC","Noto Sans TC","PingFang TC",sans-serif`;
 g.font=F(22);g.fillText(SHOP,12*f,30*f);g.textAlign='right';g.fillText(l.no,W-12*f,30*f);g.textAlign='left';g.fillRect(12*f,38*f,W-24*f,2);
 g.font='bold '+F(36);g.fillText(`${l.name||''} ${l.phone?'#'+l.phone.slice(-3):''}`,12*f,82*f,W-24*f);
 g.font='bold '+F(30);g.fillText(l.item,12*f,128*f,W-24*f);
 g.font=F(24);g.fillText('取餐 '+(l.time||''),12*f,175*f,W-24*f);
 if(l.note){g.font=F(22);g.fillText('備註：'+l.note,12*f,215*f,W-24*f)}return c}
// ESC/POS：ESC @ + GS v 0 點陣圖，每張後走紙
function raster(c){const g=c.getContext('2d'),W=c.width,H=c.height,d=g.getImageData(0,0,W,H).data,bw=W/8;
 const out=[0x1d,0x76,0x30,0,bw&255,bw>>8,H&255,H>>8];
 for(let y=0;y<H;y++)for(let x=0;x<bw;x++){let b=0;for(let i=0;i<8;i++){const p=(y*W+x*8+i)*4;if(d[p]<128)b|=0x80>>i}out.push(b)}
 out.push(0x0a,0x0a,0x0a);return out}
function b64(arr){let s='';for(let i=0;i<arr.length;i+=8192)s+=String.fromCharCode.apply(null,arr.slice(i,i+8192));return btoa(s)}
function rawbtUrl(bytes){return 'intent:base64,'+b64(bytes)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'}
function printOrder(o){const L=labelsOf(o);if(!L.length){toast('沒有要印的品項');return}const m=$('mode').value;if(m=='none')return;
 if(m=='rawbt'&&/Android/i.test(navigator.userAgent)){let bytes=[0x1b,0x40];L.forEach(l=>bytes=bytes.concat(raster(draw(l))));location.href=rawbtUrl(bytes);return}
 $('labels').innerHTML=L.map(l=>`<div class="lab"><div class="h"><span>${SHOP}</span><span>${l.no}</span></div>
 <div class="n">${esc(l.name)}　${l.phone?'#'+l.phone.slice(-3):''}</div><div class="i">${esc(l.item)}</div>
 <div class="t">取餐 ${esc(l.time)}</div><div class="x">${l.note?'備註：'+esc(l.note):''}</div></div>`).join('');setTimeout(()=>window.print(),50)}
function testPrint(){printOrder({name:'測試',phone:'0912345678',pickup:'今天 下午 4:30',items:'測試便當 x1',note:''})}
// ===== ⚙ 店家設定（存到 Google 表格「設定」，客人網頁會即時讀取）=====
let ST=null,curTab='menu',newPrice={},picFor='';
const WK='日一二三四五六',PRE_DAYS=30;
const LF=(()=>{try{return new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{day:'numeric'})}catch(e){return null}})();
function lunarDay(d){try{const p=LF&&LF.formatToParts(d).find(x=>x.type=='day');return p?parseInt(p.value,10):0}catch(e){return 0}}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function baseOpen(d){return d.getDay()!=0||[1,15].includes(lunarDay(d))}
function priceOf(m){return +(ST.price||{})[m[1]]||m[2]}
function showSet(on){document.body.classList.toggle('setmode',on);window.scrollTo(0,0);if(on){$('setBody').innerHTML='<div class="empty">讀取中…</div>';api({action:'settings'}).then(d=>{ST=d;newPrice={};tab(curTab)}).catch(e=>$('setBody').innerHTML='<div class="empty">⚠ 讀不到設定：'+esc(e)+'</div>')}}
function save(d,msg){toast('儲存中…');return api({action:'save',data:JSON.stringify(d)}).then(r=>{ST=r;toast(msg||'已儲存 ✅');tab(curTab)}).catch(e=>say('請再按一次：'+e))}
function tab(t){curTab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));if(!ST)return;const B=$('setBody');
 if(t=='cal'){const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);let h='<div class="tip">綠色＝接預訂，灰色＝不接。<b>按日期</b>就切換。<br>按「上限」可設這天最多接幾個預訂便當。（10 個以上才算預訂）</div><div class="cal">'+[...WK].map(w=>`<div class="wk">${w}</div>`).join('');
  for(let i=0;i<start.getDay();i++)h+='<div class="day na"></div>';
  for(let i=0;i<PRE_DAYS;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=ymd(d),o=ST.days[k]||{},op=o.off?false:o.on?true:baseOpen(d),lu=lunarDay(d),bk=+ST.booked[k]||0;
   h+=`<button class="day ${op?'op':'cl'}" onclick="flip('${k}')"><small>${d.getMonth()+1}月</small><b>${d.getDate()}</b><small>${op?'接預訂':'不接'}${lu==1?'・初一':lu==15?'・十五':''}</small>${bk?`<small>已訂 ${bk} 個</small>`:''}<span class="cap" onclick="event.stopPropagation();setCap('${k}')">${o.cap?'上限 '+o.cap:'上限：不限'}</span></button>`}
  B.innerHTML=h+'</div>'}
 if(t=='menu')menuTab();
 if(t=='sold'){B.innerHTML='<div class="tip">按一下切換。紅色＝<b>今天賣完</b>：客人不能選今天取餐，明天以後和預訂照常可訂；<b>明天會自動恢復</b>。</div>'+soldList().map((m,i)=>{const x=!!ST.soldOut[m[1]];return `<div class="it"><div class="nm">${esc(m[1])}</div><button class="so ${x?'x':''}" onclick="sold(${i},${!x})">${x?'⛔ 今天賣完':'✅ 有賣'}</button></div>`}).join('')}}
function flip(k){const [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d),o=ST.days[k]||{},op=o.off?false:o.on?true:baseOpen(dt),cap=+o.cap||0;
 let v=op?{off:true,cap}:(baseOpen(dt)?{cap}:{on:true,cap});if(!v.off&&!v.on&&!cap)v=null;save({days:{[k]:v}},op?`${m}/${d} 改成不接預訂`:`${m}/${d} 改成接預訂`)}
async function setCap(k){const o=ST.days[k]||{},n=await ask({ic:'📅',t:`${k.slice(5).replace('-','/')} 最多接幾個預訂便當？`,m:'不限就填 0',num:o.cap||0,ok:'儲存',okc:'gr'});if(n===null)return;
 const v={off:!!o.off,on:!!o.on,cap:n};save({days:{[k]:(!v.off&&!v.on&&!n)?null:v}},n?'上限 '+n+' 個 ✅':'不限 ✅')}
function soldList(){return (ST.menu||[]).filter(x=>x.on).map(x=>[x.cat,x.name])}
function sold(i,x){const n=soldList()[i][1];save({soldOut:{[n]:x}},x?n+' 今天賣完':n+' 恢復有賣')}
// ===== 🍱 菜單管理（存到 Google 表格「菜單」；每改一次就自動儲存，客人網頁最慢 2 分鐘內更新）=====
const CATS=['人氣餐盒','套餐','單點'];let EI=-1,EPH='';
function md(k){const [y,m,d]=String(k).split('-').map(Number);return m+'/'+d}
function menuTab(){const L=ST.menu||[],B=$('setBody');
 B.innerHTML='<div class="tip">按 <b>✏ 編輯</b> 改品名、價錢、照片、分類；<b>▲▼</b> 換順序；按 <b>下架</b> 客人就看不到（之後可再上架）。<b>每改一次就自動儲存</b>。</div>'+
 `<div class="mbar"><button onclick="edOpen(-1)">➕ 新增餐點</button><button class="gy" onclick="allOn(false)">⏬ 全部下架</button><button class="gn" onclick="allOn(true)">⏫ 全部重新上架</button></div>`+
 (L.length?L.map((x,i)=>`<div class="mi ${x.on?'':'off'}">${x.photo?`<img src="${esc(x.photo)}" alt="">`:'<div class="noimg">沒有照片</div>'}
 <div class="tx"><div class="nm">${esc(x.name)}</div><div class="sub"><span class="tag ${x.on?'':'x'}">${x.on?'上架中':'已下架'}</span>${x.lim?`<span class="tag l">🧧 限定 ${md(x.from)}–${md(x.to)}</span>`:''}</div>
 <div class="sub">${esc(x.cat)}｜<b style="color:#c05800;font-size:28px">$${x.price}</b></div></div>
 <div class="ac"><button class="mv" onclick="mv(${i},-1)" ${i?'':'disabled'}>▲ 上移</button><button onclick="edOpen(${i})">✏ 編輯</button>
 <button class="mv" onclick="mv(${i},1)" ${i<L.length-1?'':'disabled'}>▼ 下移</button><button class="${x.on?'dn':'upn'}" onclick="onOff(${i})">${x.on?'下架':'上架'}</button></div></div>`).join(''):'<div class="empty">還沒有餐點，按「➕ 新增餐點」</div>')}
function saveMenu(L,msg){toast('儲存中…');return fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'menu',pin:PIN,items:L})}).then(r=>r.json())
 .then(r=>{if(!r.ok)throw r.error;ST=r;toast(msg||'已儲存 ✅ 客人網頁會更新');tab(curTab);return true}).catch(e=>{say(e=='pin'?'密碼不對，請重新登入':String(e));tab(curTab);return false})}
function copyM(){return (ST.menu||[]).map(x=>({...x}))}
function mv(i,d){const L=copyM(),j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];ST.menu=L;tab('menu');clearTimeout(mv.t);mv.t=setTimeout(()=>saveMenu(ST.menu,'順序已儲存 ✅'),900)}
async function onOff(i){const L=copyM(),x=L[i];x.on=!x.on;
 if(!x.on&&!(await ask({ic:'⏬',t:`「${x.name}」下架？`,m:'客人網頁就看不到這個餐點\n之後可以再按「上架」',ok:'確定下架',okc:'rd'})))return;
 saveMenu(L,x.on?x.name+' 已上架 ✅':x.name+' 已下架')}
async function allOn(on){if(!(await ask(on?{ic:'⏫',t:'全部重新上架？',m:'所有餐點都會出現在客人網頁',ok:'全部上架',okc:'gr'}:{ic:'⏬',t:'全部下架？',m:'客人網頁會看不到任何餐點\n（換新菜單時用：先全部下架，再新增或上架新的）',ok:'全部下架',okc:'rd'})))return;
 const L=copyM();L.forEach(x=>x.on=on);saveMenu(L,on?'全部已上架 ✅':'全部已下架')}
function catsNow(){const c=CATS.slice();(ST.menu||[]).forEach(x=>{if(x.cat&&!c.includes(x.cat))c.push(x.cat)});return c}
function edOpen(i){EI=i;const x=i>=0?ST.menu[i]:{name:'',price:150,cat:'人氣餐盒',desc:'',photo:'',on:true,lim:false,from:'',to:''};EPH=x.photo||'';
 $('edT').textContent=i>=0?'✏ 編輯餐點':'➕ 新增餐點';$('eName').value=x.name;$('ePrice').value=x.price;$('eDesc').value=x.desc||'';
 $('eCat').innerHTML=catsNow().map(c=>`<option ${c==x.cat?'selected':''}>${esc(c)}</option>`).join('')+'<option value="+">＋ 新分類…</option>';$('eCatNew').style.display='none';$('eCatNew').value='';
 $('eLim').checked=!!x.lim;$('eLimBox').style.display=x.lim?'block':'none';$('eFrom').value=x.from||'';$('eTo').value=x.to||'';$('eOn').checked=!!x.on;
 $('ePic').src=EPH||'';$('ePicSt').textContent=EPH?'':'還沒有照片';$('eDelBox').style.display=i>=0?'flex':'none';$('ed').style.display='flex';$('ed').querySelector('.bx').scrollTop=0}
function edClose(){$('ed').style.display='none'}
function ePrice(d){$('ePrice').value=Math.max(10,(parseInt($('ePrice').value,10)||0)+d)}
async function edOk(){const name=$('eName').value.trim(),price=parseInt(String($('ePrice').value).replace(/\D/g,''),10),cat=$('eCat').value=='+'?$('eCatNew').value.trim():$('eCat').value;
 const lim=$('eLim').checked,from=$('eFrom').value,to=$('eTo').value;
 if(!name)return say('請填品名','還沒填好');if(!(price>0&&price<10000))return say('價錢要是 1～9999 的數字','還沒填好');if(!cat)return say('請填分類','還沒填好');
 if((ST.menu||[]).some((x,j)=>j!=EI&&x.name==name))return say('已經有「'+name+'」了，請換個名字','品名重複');
 if(lim&&(!from||!to||from>to))return say('限定期間請選開始和最後取餐日','還沒填好');
 const L=copyM(),old=EI>=0?L[EI]:{id:''},it={...old,name,price,cat,desc:$('eDesc').value.trim(),photo:EPH,lim,from:lim?from:'',to:lim?to:'',on:$('eOn').checked};
 if(EI>=0)L[EI]=it;else L.unshift(it);if(await saveMenu(L,(EI>=0?'已修改 ':'已新增 ')+name+' ✅'))edClose()}
async function edDel(){const x=ST.menu[EI];if(!(await ask({ic:'🗑',t:`刪除「${x.name}」？`,m:'刪掉就不見了。\n只是暫時不賣的話，請用「下架」',ok:'確定刪除',okc:'rd'})))return;
 const L=copyM();L.splice(EI,1);if(await saveMenu(L,'已刪除 '+x.name))edClose()}
function pickPic(){$('pic').value='';$('pic').click()}
function shrink(file,max=800,qual=0.75){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',qual))};im.onerror=()=>rej('讀不到照片');im.src=u})}
async function gotPic(inp){const f=inp.files&&inp.files[0];if(!f)return;try{$('ePicSt').textContent='照片縮小中…';const data=await shrink(f);$('ePic').src=data;
 $('ePicSt').textContent=`上傳中，請稍等…（${Math.round(data.length*0.75/1024)} KB）`;
 const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'photo',pin:PIN,name:$('eName').value.trim()||'新餐點',data,forMenu:1})}).then(r=>r.json());
 if(!r.ok)throw r.error;EPH=r.url;$('ePicSt').textContent='✅ 照片上傳好了，按「完成」儲存'}catch(e){$('ePic').src=EPH||'';$('ePicSt').textContent='';say('照片沒有上傳成功，請再試一次：'+e)}}
$('size').value=localStorage.ly_size||'40';setSize();$('mode').value=localStorage.ly_mode||'rawbt';$('skip').checked=!!localStorage.ly_skip;
if(!GAS_URL){$('conn').textContent='⚠ 尚未設定後端網址'}
if(PIN){$('pin').style.display='none';start()}else $('pin').style.display='flex';
</script></body></html>
